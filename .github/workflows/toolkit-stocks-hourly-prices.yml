name: Toolkit stocks hourly prices

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./toolkit-stocks

    steps:
      - uses: actions/checkout@v5
        with:
          ref: BP/sma101

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: toolkit-stocks/requirements.txt

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Run metrics pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/main.py --prod --fetch metrics
