name: Toolkit stocks daily - financial analysis

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./toolkit-stocks

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: toolkit-stocks/requirements.txt
      
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Run script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/main.py --fa
